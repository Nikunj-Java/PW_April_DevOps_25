name: Python CI

on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run : |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
      - name: Run Tests
        run : python -m unittest discover -s tests

      - name: Package build output as zip
        run: |
          mkdir output
          cp -r src output/
          zip -r build.zip output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-zip
          path: build.zip
      - name : Notify Success Via Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with: 
          server_address: smtp.gmail.com
          server_port: 587
          username: your_email_id
          password: your_app_password
          subject: "CI Build Success -${{ github.repository}}"
          body: |
            The build for ${{ github.repository }} on branch ${{ github.ref_name}} succeeded.
            commit: ${{ github.sha }}
          to: recepients_email_id
          from: your_email_id
