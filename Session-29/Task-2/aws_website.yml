---
- name: EC2 instance AWS Configuration
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - vars.yml
  
  tasks:
    - name: Launch EC2 Instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        region: "{{ region }}"
        wait: yes
        count: 1
        security_group: "{{ security_group }}"
        network:
          assign_public_ip: true
        tags:
          Environment: Dev
      register: ec2

    - name: Print Public IP 
      debug:
        msg: "Public IP: {{ec2.instances[0].public_ip_address}}"
    - name: Add new instance to inventory
      add_host:
        name: webserver
        ansible_host: "{{ ec2.instances[0].public_ip_address }}"
        ansible_ssh_private_key_file: nikunj

- name: Deploy Website on new EC2 Instance
  hosts: webserver
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
    - name: Install Nginx
      apt: 
        name: nginx
        state: present
    - name: Start and Enable Nginx
      service: 
        name: nginx
        state: started
        enabled: yes
    - name: Create Website Directory
      file:
        path: /var/www/mywebsite
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
    - name: Copy Website Files
      copy: 
        src: index.html
        dest: /var/www/mywebsite/index.html
        group: www-data
        owner: www-data
        mode: '0644'
    - name: Configure Nginx For My Website
      copy:
        dest: /etc/nginx/sites-available/mywebsite
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/mywebsite;
              index index.html
          }
    - name: Enable sites
      file: 
        src: /etc/nginx/sites-available/mywebsite
        dest: /etc/nginx/sites-enabled/mywebsite
        state: link
    - name: Remove default Nginx sites
      file: 
        path: /etc/nginx/sites-enabled/default
        state: absent
    - name: Reload Nginx
      service: 
        name: nginx
        state: reloaded

