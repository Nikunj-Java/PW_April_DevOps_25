---
- name: EC2 instance AWS Configuration
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - vars.yml
  
  tasks:
    - name: Launch EC2 Instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        region: "{{ region }}"
        wait: yes
        count: 1
        security_groups: [ "{{ security_group }}" ]
        network:
          assign_public_ip: true
        tags:
          Environment: Dev
      register: ec2

    - name: Print Public IP 
      debug:
        msg: "Public IP: {{ ec2.instances[0].public_ip_address }}"

    - name: Save dynamic inventory to file
      copy:
        dest: ./newinventory.yml
        content: |
          all:
            hosts:
              webserver:
                ansible_host: {{ ec2.instances[0].public_ip_address }}
                ansible_user: ubuntu
                ansible_ssh_private_key_file: ./nikunj.pem

